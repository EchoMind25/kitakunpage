<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <radialGradient id="bg4" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="40%" stop-color="#0d9488" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="0.45" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="60%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="eyeBloom">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBloom">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="tinyBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="scarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a52020" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#a52020" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bg4)"/>

  <!-- Subtle diagonal lines suggesting tension -->
  <g stroke="#14b8a6" stroke-width="0.5" opacity="0.06">
    <line x1="0" y1="0" x2="800" y2="1200"/>
    <line x1="100" y1="0" x2="800" y2="1050"/>
    <line x1="200" y1="0" x2="800" y2="900"/>
    <line x1="0" y1="150" x2="800" y2="1200"/>
    <line x1="0" y1="300" x2="650" y2="1200"/>
    <line x1="800" y1="0" x2="0" y2="1200"/>
    <line x1="700" y1="0" x2="0" y2="1050"/>
    <line x1="600" y1="0" x2="0" y2="900"/>
    <line x1="800" y1="150" x2="0" y2="1200"/>
    <line x1="800" y1="300" x2="150" y2="1200"/>
  </g>

  <!-- Large silhouette head shape filling most of the panel -->
  <ellipse cx="400" cy="520" rx="340" ry="420" fill="url(#faceGrad)" opacity="0.95"/>

  <!-- Hair/top of head shape -->
  <path d="M 120,400 Q 100,200 250,120 Q 350,70 400,60 Q 450,70 550,120 Q 700,200 680,400 Q 650,300 550,250 Q 450,220 400,215 Q 350,220 250,250 Q 150,300 120,400 Z" fill="#0a0a0a"/>

  <!-- Jawline definition -->
  <path d="M 150,650 Q 200,850 400,920 Q 600,850 650,650" fill="none" stroke="#1a1a1a" stroke-width="3" opacity="0.5"/>

  <!-- Nose bridge shadow -->
  <path d="M 390,420 L 385,560 Q 395,580 405,580 Q 415,580 420,560 L 410,420" fill="#111111" opacity="0.4"/>

  <!-- Ambient eye glow illuminating the face -->
  <ellipse cx="400" cy="480" rx="250" ry="150" fill="#0d9488" opacity="0.04" filter="url(#softBloom)"/>

  <!-- THE EYE - main focal point -->
  <g transform="translate(400, 480)">
    <!-- Eye glow aura -->
    <ellipse cx="0" cy="0" rx="120" ry="70" fill="url(#eyeGlow)" opacity="0.3" filter="url(#softBloom)"/>

    <!-- Eye white (sclera) -->
    <ellipse cx="0" cy="0" rx="110" ry="50" fill="#e8e8e8" opacity="0.9"/>

    <!-- Subtle blood vessel hints -->
    <g stroke="#a52020" stroke-width="0.5" opacity="0.2">
      <path d="M -90,-10 Q -60,-15 -40,-5" fill="none"/>
      <path d="M -85,15 Q -60,10 -35,8" fill="none"/>
      <path d="M 90,-8 Q 65,-12 45,-3" fill="none"/>
      <path d="M 80,18 Q 60,12 40,10" fill="none"/>
    </g>

    <!-- Iris -->
    <circle cx="5" cy="0" r="38" fill="url(#irisGrad)" filter="url(#eyeBloom)"/>

    <!-- Iris detail rings -->
    <circle cx="5" cy="0" r="38" fill="none" stroke="#0d9488" stroke-width="0.5" opacity="0.5"/>
    <circle cx="5" cy="0" r="30" fill="none" stroke="#14b8a6" stroke-width="0.3" opacity="0.4"/>

    <!-- Iris fiber patterns -->
    <g stroke="#14b8a6" stroke-width="0.5" opacity="0.3">
      <line x1="5" y1="-38" x2="5" y2="-18"/>
      <line x1="5" y1="38" x2="5" y2="18"/>
      <line x1="-33" y1="0" x2="-13" y2="0"/>
      <line x1="43" y1="0" x2="23" y2="0"/>
      <line x1="-22" y1="-28" x2="-8" y2="-14"/>
      <line x1="32" y1="-28" x2="18" y2="-14"/>
      <line x1="-22" y1="28" x2="-8" y2="14"/>
      <line x1="32" y1="28" x2="18" y2="14"/>
      <line x1="-28" y1="-15" x2="-10" y2="-8"/>
      <line x1="38" y1="-15" x2="20" y2="-8"/>
      <line x1="-28" y1="15" x2="-10" y2="8"/>
      <line x1="38" y1="15" x2="20" y2="8"/>
    </g>

    <!-- Pupil -->
    <circle cx="5" cy="0" r="16" fill="url(#pupilGrad)"/>

    <!-- Light reflections -->
    <ellipse cx="-8" cy="-10" rx="6" ry="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="15" cy="8" r="3" fill="#ffffff" opacity="0.4"/>
    <circle cx="-2" cy="-6" r="1.5" fill="#ffffff" opacity="0.6"/>

    <!-- Eyelid edges -->
    <path d="M -110,0 Q -60,-55 0,-52 Q 60,-55 110,0" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M -110,0 Q -60,55 0,52 Q 60,55 110,0" fill="none" stroke="#1a1a1a" stroke-width="4"/>

    <!-- Eyelash hints -->
    <g stroke="#0a0a0a" stroke-width="2" opacity="0.7">
      <line x1="-100" y1="-5" x2="-108" y2="-15"/>
      <line x1="-80" y1="-20" x2="-88" y2="-35"/>
      <line x1="-55" y1="-35" x2="-58" y2="-50"/>
      <line x1="-25" y1="-45" x2="-26" y2="-60"/>
      <line x1="5" y1="-50" x2="5" y2="-65"/>
      <line x1="35" y1="-48" x2="38" y2="-62"/>
      <line x1="60" y1="-38" x2="66" y2="-52"/>
      <line x1="85" y1="-22" x2="94" y2="-35"/>
      <line x1="102" y1="-8" x2="112" y2="-16"/>
    </g>
  </g>

  <!-- Scar across face (maroon) -->
  <path d="M 220,350 Q 300,400 380,460 Q 420,490 470,530 Q 540,580 600,650"
        fill="none" stroke="url(#scarGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 225,354 Q 305,404 383,463 Q 423,493 473,533 Q 543,583 603,653"
        fill="none" stroke="#a52020" stroke-width="1" stroke-linecap="round" opacity="0.3" filter="url(#tinyBlur)"/>

  <!-- Mouth hint in shadow -->
  <path d="M 340,700 Q 400,715 460,700" fill="none" stroke="#1a1a1a" stroke-width="2" opacity="0.4"/>
  <path d="M 360,710 Q 400,718 440,710" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>

  <!-- Bottom darkness fade -->
  <rect x="0" y="900" width="800" height="300" fill="#0a0a0a" opacity="0.8"/>
  <rect x="0" y="850" width="800" height="100" fill="#0a0a0a" opacity="0.4"/>

  <!-- Top shadow for forehead -->
  <rect x="0" y="0" width="800" height="200" fill="#0a0a0a" opacity="0.6"/>

  <!-- Atmospheric teal tint on bottom text area -->
  <text x="400" y="1080" text-anchor="middle" font-family="'Georgia', serif" font-size="18" fill="#14b8a6" opacity="0.3" letter-spacing="8">WHO ARE YOU?</text>

  <!-- Thin border accents -->
  <line x1="250" y1="1100" x2="550" y2="1100" stroke="#a52020" stroke-width="1" opacity="0.3"/>

  <!-- Panel border -->
  <rect x="1" y="1" width="798" height="1198" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.15"/>
</svg>