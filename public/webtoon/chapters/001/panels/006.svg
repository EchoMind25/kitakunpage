<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="fadeLineT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeLineM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a52020" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a52020" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a52020" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="endGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow6">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow6">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg6)"/>

  <!-- Ambient glow behind text area -->
  <circle cx="400" cy="460" r="250" fill="url(#endGlow)" filter="url(#softGlow6)"/>

  <!-- Upper decorative zone - fading geometric remnants -->
  <g opacity="0.08">
    <polygon points="300,80 340,60 360,100 320,120" fill="none" stroke="#14b8a6" stroke-width="0.8"/>
    <polygon points="450,50 500,40 510,85 460,95" fill="none" stroke="#14b8a6" stroke-width="0.6"/>
    <polygon points="200,120 230,100 250,140" fill="none" stroke="#a52020" stroke-width="0.5"/>
    <polygon points="560,100 590,80 600,120" fill="none" stroke="#a52020" stroke-width="0.5"/>
    <circle cx="380" cy="130" r="15" fill="none" stroke="#0d9488" stroke-width="0.5"/>
    <circle cx="420" cy="90" r="8" fill="none" stroke="#ffffff" stroke-width="0.3"/>
  </g>

  <!-- Floating particles drifting upward -->
  <g opacity="0.2">
    <circle cx="200" cy="200" r="1.5" fill="#14b8a6"/>
    <circle cx="350" cy="180" r="1" fill="#14b8a6"/>
    <circle cx="500" cy="210" r="1.8" fill="#0d9488"/>
    <circle cx="620" cy="190" r="1.2" fill="#14b8a6"/>
    <circle cx="150" cy="280" r="1" fill="#a52020"/>
    <circle cx="300" cy="260" r="1.5" fill="#0d9488"/>
    <circle cx="480" cy="250" r="1" fill="#a52020"/>
    <circle cx="660" cy="270" r="1.3" fill="#14b8a6"/>
  </g>

  <!-- Horizontal decorative lines above text -->
  <line x1="150" y1="360" x2="650" y2="360" stroke="url(#fadeLineT)" stroke-width="0.5"/>
  <line x1="200" y1="370" x2="600" y2="370" stroke="url(#fadeLineM)" stroke-width="0.5" opacity="0.6"/>

  <!-- Three decorative dots -->
  <circle cx="370" cy="400" r="3" fill="#14b8a6" opacity="0.4" filter="url(#subtleGlow)"/>
  <circle cx="400" cy="400" r="3" fill="#ffffff" opacity="0.3" filter="url(#subtleGlow)"/>
  <circle cx="430" cy="400" r="3" fill="#a52020" opacity="0.4" filter="url(#subtleGlow)"/>

  <!-- Main text: "To Be Continued..." -->
  <text x="400" y="480" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="42" fill="#ffffff" opacity="0.85" letter-spacing="4" filter="url(#textGlow6)">To Be Continued</text>

  <!-- Ellipsis dots with individual styling -->
  <circle cx="358" cy="520" r="3" fill="#14b8a6" opacity="0.6"/>
  <circle cx="390" cy="520" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="422" cy="520" r="3" fill="#a52020" opacity="0.6"/>

  <!-- Horizontal decorative lines below text -->
  <line x1="200" y1="560" x2="600" y2="560" stroke="url(#fadeLineM)" stroke-width="0.5" opacity="0.6"/>
  <line x1="150" y1="570" x2="650" y2="570" stroke="url(#fadeLineT)" stroke-width="0.5"/>

  <!-- Downward fading elements -->
  <g opacity="0.1">
    <!-- Thin vertical lines fading down -->
    <line x1="300" y1="600" x2="300" y2="750" stroke="#14b8a6" stroke-width="0.5" opacity="0.5"/>
    <line x1="400" y1="620" x2="400" y2="800" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <line x1="500" y1="600" x2="500" y2="750" stroke="#a52020" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Small geometric shapes at bottom - echoing panel 001 -->
  <g opacity="0.06">
    <polygon points="400,700 430,730 400,760 370,730" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <polygon points="400,720 415,735 400,750 385,735" fill="none" stroke="#a52020" stroke-width="0.5"/>
  </g>

  <!-- Bottom corner accents matching panel 001 style -->
  <g opacity="0.15">
    <line x1="40" y1="940" x2="120" y2="940" stroke="#0d9488" stroke-width="1"/>
    <line x1="40" y1="880" x2="40" y2="940" stroke="#0d9488" stroke-width="1"/>
    <line x1="680" y1="940" x2="760" y2="940" stroke="#a52020" stroke-width="1"/>
    <line x1="760" y1="880" x2="760" y2="940" stroke="#a52020" stroke-width="1"/>
  </g>

  <!-- Chapter indicator at very bottom -->
  <text x="400" y="920" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="12" fill="#0d9488" letter-spacing="6" opacity="0.3">CHAPTER 1 END</text>

  <!-- Fine border -->
  <rect x="15" y="15" width="770" height="970" fill="none" stroke="#0d9488" stroke-width="0.5" opacity="0.1"/>
</svg>