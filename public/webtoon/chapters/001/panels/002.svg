<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="40%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a52020" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#7f1d1d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bg2)"/>

  <!-- Large ambient glows -->
  <circle cx="250" cy="350" r="250" fill="url(#orb1)" filter="url(#blur3)"/>
  <circle cx="580" cy="800" r="200" fill="url(#orb2)" filter="url(#blur3)"/>

  <!-- Grid of faint dots -->
  <g opacity="0.08" fill="#14b8a6">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/><circle cx="700" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="600" cy="200" r="1.5"/><circle cx="700" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/><circle cx="600" cy="300" r="1.5"/><circle cx="700" cy="300" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/><circle cx="500" cy="400" r="1.5"/><circle cx="600" cy="400" r="1.5"/><circle cx="700" cy="400" r="1.5"/>
    <circle cx="100" cy="500" r="1.5"/><circle cx="200" cy="500" r="1.5"/><circle cx="300" cy="500" r="1.5"/><circle cx="400" cy="500" r="1.5"/><circle cx="500" cy="500" r="1.5"/><circle cx="600" cy="500" r="1.5"/><circle cx="700" cy="500" r="1.5"/>
    <circle cx="100" cy="600" r="1.5"/><circle cx="200" cy="600" r="1.5"/><circle cx="300" cy="600" r="1.5"/><circle cx="400" cy="600" r="1.5"/><circle cx="500" cy="600" r="1.5"/><circle cx="600" cy="600" r="1.5"/><circle cx="700" cy="600" r="1.5"/>
    <circle cx="100" cy="700" r="1.5"/><circle cx="200" cy="700" r="1.5"/><circle cx="300" cy="700" r="1.5"/><circle cx="400" cy="700" r="1.5"/><circle cx="500" cy="700" r="1.5"/><circle cx="600" cy="700" r="1.5"/><circle cx="700" cy="700" r="1.5"/>
    <circle cx="100" cy="800" r="1.5"/><circle cx="200" cy="800" r="1.5"/><circle cx="300" cy="800" r="1.5"/><circle cx="400" cy="800" r="1.5"/><circle cx="500" cy="800" r="1.5"/><circle cx="600" cy="800" r="1.5"/><circle cx="700" cy="800" r="1.5"/>
    <circle cx="100" cy="900" r="1.5"/><circle cx="200" cy="900" r="1.5"/><circle cx="300" cy="900" r="1.5"/><circle cx="400" cy="900" r="1.5"/><circle cx="500" cy="900" r="1.5"/><circle cx="600" cy="900" r="1.5"/><circle cx="700" cy="900" r="1.5"/>
    <circle cx="100" cy="1000" r="1.5"/><circle cx="200" cy="1000" r="1.5"/><circle cx="300" cy="1000" r="1.5"/><circle cx="400" cy="1000" r="1.5"/><circle cx="500" cy="1000" r="1.5"/><circle cx="600" cy="1000" r="1.5"/><circle cx="700" cy="1000" r="1.5"/>
    <circle cx="100" cy="1100" r="1.5"/><circle cx="200" cy="1100" r="1.5"/><circle cx="300" cy="1100" r="1.5"/><circle cx="400" cy="1100" r="1.5"/><circle cx="500" cy="1100" r="1.5"/><circle cx="600" cy="1100" r="1.5"/><circle cx="700" cy="1100" r="1.5"/>
  </g>

  <!-- Primary circle cluster - top area -->
  <circle cx="280" cy="320" r="120" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
  <circle cx="280" cy="320" r="90" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <circle cx="280" cy="320" r="55" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.6"/>
  <circle cx="280" cy="320" r="20" fill="#14b8a6" opacity="0.15"/>
  <circle cx="280" cy="320" r="5" fill="#14b8a6" opacity="0.8" filter="url(#glow2)"/>

  <!-- Secondary circle cluster - right middle -->
  <circle cx="560" cy="580" r="95" fill="none" stroke="#a52020" stroke-width="1.5" opacity="0.4"/>
  <circle cx="560" cy="580" r="65" fill="none" stroke="#a52020" stroke-width="1" opacity="0.3"/>
  <circle cx="560" cy="580" r="35" fill="none" stroke="#7f1d1d" stroke-width="2" opacity="0.5"/>
  <circle cx="560" cy="580" r="12" fill="#a52020" opacity="0.2"/>
  <circle cx="560" cy="580" r="4" fill="#a52020" opacity="0.7" filter="url(#glow2)"/>

  <!-- Tertiary circle cluster - lower left -->
  <circle cx="200" cy="820" r="80" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="820" r="50" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="200" cy="820" r="25" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="820" r="4" fill="#ffffff" opacity="0.5" filter="url(#glow2)"/>

  <!-- Small scattered circles -->
  <circle cx="620" cy="200" r="30" fill="none" stroke="#0d9488" stroke-width="0.8" opacity="0.25"/>
  <circle cx="620" cy="200" r="3" fill="#0d9488" opacity="0.5"/>
  <circle cx="450" cy="950" r="45" fill="none" stroke="#a52020" stroke-width="0.8" opacity="0.2"/>
  <circle cx="450" cy="950" r="3" fill="#a52020" opacity="0.4"/>
  <circle cx="680" cy="400" r="20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <circle cx="120" cy="550" r="25" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.15"/>
  <circle cx="500" cy="150" r="15" fill="none" stroke="#a52020" stroke-width="0.5" opacity="0.2"/>
  <circle cx="350" cy="1080" r="35" fill="none" stroke="#0d9488" stroke-width="0.5" opacity="0.15"/>

  <!-- Connecting lines between clusters -->
  <line x1="280" y1="320" x2="560" y2="580" stroke="#14b8a6" stroke-width="0.8" opacity="0.15"/>
  <line x1="560" y1="580" x2="200" y2="820" stroke="#a52020" stroke-width="0.8" opacity="0.12"/>
  <line x1="280" y1="320" x2="200" y2="820" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <!-- Curved connecting lines -->
  <path d="M280,320 Q400,200 620,200" fill="none" stroke="#0d9488" stroke-width="0.6" opacity="0.15"/>
  <path d="M560,580 Q650,750 450,950" fill="none" stroke="#a52020" stroke-width="0.6" opacity="0.12"/>
  <path d="M200,820 Q280,950 350,1080" fill="none" stroke="#14b8a6" stroke-width="0.6" opacity="0.12"/>

  <!-- Dashed orbital rings -->
  <ellipse cx="400" cy="550" rx="300" ry="180" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-dasharray="8,12" opacity="0.12" transform="rotate(-15, 400, 550)"/>
  <ellipse cx="400" cy="550" rx="220" ry="350" fill="none" stroke="#a52020" stroke-width="0.5" stroke-dasharray="6,10" opacity="0.1" transform="rotate(10, 400, 550)"/>

  <!-- Small bright accent dots -->
  <circle cx="380" cy="240" r="2" fill="#14b8a6" opacity="0.6"/>
  <circle cx="480" cy="480" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="320" cy="680" r="2" fill="#a52020" opacity="0.5"/>
  <circle cx="640" cy="340" r="2" fill="#14b8a6" opacity="0.4"/>
  <circle cx="160" cy="420" r="2" fill="#0d9488" opacity="0.3"/>
  <circle cx="520" cy="760" r="2" fill="#a52020" opacity="0.4"/>
  <circle cx="380" cy="1000" r="2" fill="#14b8a6" opacity="0.3"/>
  <circle cx="700" cy="650" r="2" fill="#ffffff" opacity="0.2"/>

  <!-- Thin border -->
  <rect x="15" y="15" width="770" height="1170" fill="none" stroke="#0d9488" stroke-width="0.5" opacity="0.15"/>
</svg>