<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="35%" stop-color="#0a0a0a"/>
      <stop offset="65%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#a52020" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a52020" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="figureBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <filter id="moonBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="groundFog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky gradient background -->
  <rect width="800" height="1200" fill="url(#skyGrad)"/>
  <rect width="800" height="1200" fill="url(#horizonGlow)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1" opacity="0.7"/>
    <circle cx="340" cy="45" r="1.2" opacity="0.8"/>
    <circle cx="560" cy="110" r="0.8" opacity="0.5"/>
    <circle cx="700" cy="60" r="1" opacity="0.6"/>
    <circle cx="230" cy="150" r="0.7" opacity="0.4"/>
    <circle cx="480" cy="170" r="1" opacity="0.5"/>
    <circle cx="650" cy="180" r="0.8" opacity="0.3"/>
    <circle cx="90" cy="200" r="1" opacity="0.5"/>
    <circle cx="380" cy="230" r="0.6" opacity="0.3"/>
    <circle cx="180" cy="280" r="0.8" opacity="0.4"/>
    <circle cx="720" cy="250" r="0.7" opacity="0.3"/>
    <circle cx="55" cy="340" r="0.6" opacity="0.25"/>
    <circle cx="600" cy="300" r="0.9" opacity="0.35"/>
    <circle cx="440" cy="120" r="1.3" opacity="0.6" filter="url(#starGlow)"/>
    <circle cx="160" cy="55" r="1.1" opacity="0.65" filter="url(#starGlow)"/>
  </g>

  <!-- Moon halo -->
  <circle cx="580" cy="220" r="120" fill="url(#moonHalo)" filter="url(#moonBlur)"/>

  <!-- Moon -->
  <circle cx="580" cy="220" r="40" fill="url(#moonGrad)"/>
  <circle cx="595" cy="210" r="38" fill="#0a0a0a" opacity="0.15"/>

  <!-- Horizon line - subtle glow -->
  <rect x="0" y="690" width="800" height="4" fill="#14b8a6" opacity="0.08"/>
  <rect x="0" y="692" width="800" height="1" fill="#14b8a6" opacity="0.2"/>

  <!-- Distant landscape silhouettes -->
  <path d="M0,700 Q100,670 200,690 Q300,665 400,685 Q500,660 600,680 Q700,670 800,695 L800,720 L0,720 Z" fill="#0a0a0a" opacity="0.8"/>
  <path d="M0,710 Q150,695 300,705 Q450,690 550,700 Q650,695 800,710 L800,730 L0,730 Z" fill="#0a0a0a"/>

  <!-- Ground -->
  <rect x="0" y="720" width="800" height="480" fill="#0a0a0a"/>
  <rect x="0" y="720" width="800" height="80" fill="url(#groundFog)"/>

  <!-- Figure silhouette - standing person looking at sky -->
  <g filter="url(#figureBlur)">
    <!-- Body -->
    <path d="
      M380,440
      C378,445 375,460 374,480
      L372,520
      C370,540 368,560 370,580
      L371,600
      C372,620 370,640 368,660
      L366,680
      C365,690 364,700 362,710
      L360,720
      L340,720
      L345,700
      C346,690 348,680 348,670
      L350,650
      C350,640 349,630 348,620
      L340,720
      L335,720
      L348,600

      M372,520
      L395,520
      C400,530 402,540 400,560
      L398,580
      C396,600 395,620 396,640
      L398,660
      C400,680 402,700 405,720
      L420,720
      L415,700
      C412,680 410,660 410,640
      L412,620
      C414,600 416,580 418,560
      L460,720
      L455,720
      L414,580
    " fill="#0a0a0a"/>

    <!-- Head -->
    <ellipse cx="385" cy="425" rx="18" ry="22" fill="#0a0a0a"/>

    <!-- Simplified body block -->
    <path d="
      M362,450 L408,450 L415,520 L405,600 L418,720 L455,720 L460,720 L405,720 L340,720 L335,720 L360,720 L365,600 L355,520 Z
    " fill="#0a0a0a"/>

    <!-- Hair flowing slightly -->
    <path d="M367,415 Q360,410 358,420 Q355,435 360,445" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2"/>
    <path d="M403,418 Q410,412 415,420 Q420,430 418,440" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2"/>

    <!-- Arm reaching slightly out -->
    <path d="M408,470 Q430,465 445,475 Q455,480 460,490" fill="none" stroke="#0a0a0a" stroke-width="8" stroke-linecap="round"/>

    <!-- Coat/cloak edge catching light -->
    <path d="M355,500 Q350,580 340,680 Q338,700 335,720" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.2"/>
    <path d="M415,500 Q420,580 430,680 Q432,700 455,720" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.15"/>
  </g>

  <!-- Light reflection on figure edge (moonlight rim) -->
  <path d="M403,410 Q410,430 412,460 Q414,490 416,520" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.15"/>

  <!-- Ground shadow extending from figure -->
  <ellipse cx="400" cy="720" rx="80" ry="8" fill="#000000" opacity="0.3"/>

  <!-- Atmospheric particles near horizon -->
  <g opacity="0.15">
    <circle cx="150" cy="680" r="1" fill="#14b8a6"/>
    <circle cx="300" cy="695" r="0.8" fill="#14b8a6"/>
    <circle cx="520" cy="685" r="1.2" fill="#14b8a6"/>
    <circle cx="680" cy="690" r="0.7" fill="#14b8a6"/>
  </g>

  <!-- Bottom atmospheric maroon glow -->
  <rect x="0" y="1050" width="800" height="150" fill="#7f1d1d" opacity="0.05"/>

  <!-- Subtle vignette corners -->
  <rect x="15" y="15" width="770" height="1170" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.1"/>
</svg>