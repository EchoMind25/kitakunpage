<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="maroonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#a52020"/>
    </linearGradient>
    <radialGradient id="centerBurst" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#0d9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="diamond">
      <polygon points="400,150 650,500 400,850 150,500"/>
    </clipPath>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bg1)"/>
  <rect width="800" height="1200" fill="url(#centerBurst)"/>

  <!-- Radiating lines from center -->
  <g opacity="0.15" stroke="#14b8a6" stroke-width="1">
    <line x1="400" y1="500" x2="0" y2="0"/>
    <line x1="400" y1="500" x2="200" y2="0"/>
    <line x1="400" y1="500" x2="400" y2="0"/>
    <line x1="400" y1="500" x2="600" y2="0"/>
    <line x1="400" y1="500" x2="800" y2="0"/>
    <line x1="400" y1="500" x2="800" y2="250"/>
    <line x1="400" y1="500" x2="800" y2="500"/>
    <line x1="400" y1="500" x2="800" y2="750"/>
    <line x1="400" y1="500" x2="800" y2="1000"/>
    <line x1="400" y1="500" x2="600" y2="1200"/>
    <line x1="400" y1="500" x2="400" y2="1200"/>
    <line x1="400" y1="500" x2="200" y2="1200"/>
    <line x1="400" y1="500" x2="0" y2="1000"/>
    <line x1="400" y1="500" x2="0" y2="750"/>
    <line x1="400" y1="500" x2="0" y2="500"/>
    <line x1="400" y1="500" x2="0" y2="250"/>
  </g>

  <!-- Large diamond frame -->
  <polygon points="400,120 680,500 400,880 120,500" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.6"/>
  <polygon points="400,160 645,500 400,840 155,500" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>

  <!-- Inner geometric pattern -->
  <g clip-path="url(#diamond)">
    <!-- Horizontal bands inside diamond -->
    <rect x="100" y="280" width="600" height="3" fill="#a52020" opacity="0.5"/>
    <rect x="100" y="360" width="600" height="2" fill="#14b8a6" opacity="0.3"/>
    <rect x="100" y="440" width="600" height="4" fill="#a52020" opacity="0.4"/>
    <rect x="100" y="500" width="600" height="1" fill="#ffffff" opacity="0.2"/>
    <rect x="100" y="560" width="600" height="4" fill="#a52020" opacity="0.4"/>
    <rect x="100" y="640" width="600" height="2" fill="#14b8a6" opacity="0.3"/>
    <rect x="100" y="720" width="600" height="3" fill="#a52020" opacity="0.5"/>

    <!-- Cross in center -->
    <line x1="400" y1="250" x2="400" y2="750" stroke="#14b8a6" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="500" x2="600" y2="500" stroke="#14b8a6" stroke-width="1" opacity="0.5"/>

    <!-- Inner diamonds -->
    <polygon points="400,300 530,500 400,700 270,500" fill="none" stroke="#a52020" stroke-width="1.5" opacity="0.6"/>
    <polygon points="400,380 470,500 400,620 330,500" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Corner accents top-left -->
  <line x1="40" y1="40" x2="160" y2="40" stroke="#0d9488" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="160" stroke="#0d9488" stroke-width="2"/>
  <!-- Corner accents top-right -->
  <line x1="640" y1="40" x2="760" y2="40" stroke="#0d9488" stroke-width="2"/>
  <line x1="760" y1="40" x2="760" y2="160" stroke="#0d9488" stroke-width="2"/>
  <!-- Corner accents bottom-left -->
  <line x1="40" y1="1160" x2="160" y2="1160" stroke="#a52020" stroke-width="2"/>
  <line x1="40" y1="1040" x2="40" y2="1160" stroke="#a52020" stroke-width="2"/>
  <!-- Corner accents bottom-right -->
  <line x1="640" y1="1160" x2="760" y2="1160" stroke="#a52020" stroke-width="2"/>
  <line x1="760" y1="1040" x2="760" y2="1160" stroke="#a52020" stroke-width="2"/>

  <!-- Glowing center point -->
  <circle cx="400" cy="500" r="30" fill="#14b8a6" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="400" cy="500" r="6" fill="#14b8a6" opacity="0.6"/>
  <circle cx="400" cy="500" r="3" fill="#ffffff" opacity="0.8"/>

  <!-- Small accent dots along diamond edges -->
  <circle cx="400" cy="120" r="4" fill="#a52020" filter="url(#glow1)"/>
  <circle cx="680" cy="500" r="4" fill="#14b8a6" filter="url(#glow1)"/>
  <circle cx="400" cy="880" r="4" fill="#a52020" filter="url(#glow1)"/>
  <circle cx="120" cy="500" r="4" fill="#14b8a6" filter="url(#glow1)"/>

  <!-- Chapter label -->
  <text x="400" y="960" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="18" fill="#0d9488" letter-spacing="8" opacity="0.7">CHAPTER</text>

  <!-- Chapter number -->
  <text x="400" y="1010" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="72" fill="#ffffff" font-weight="bold" opacity="0.9">1</text>

  <!-- Title -->
  <text x="400" y="1070" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="28" fill="#a52020" letter-spacing="3">The Beginning</text>

  <!-- Subtle underline -->
  <line x1="280" y1="1090" x2="520" y2="1090" stroke="#a52020" stroke-width="1" opacity="0.4"/>

  <!-- Decorative dots below title -->
  <circle cx="370" cy="1115" r="2" fill="#14b8a6" opacity="0.5"/>
  <circle cx="400" cy="1115" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="430" cy="1115" r="2" fill="#14b8a6" opacity="0.5"/>

  <!-- Fine border -->
  <rect x="20" y="20" width="760" height="1160" fill="none" stroke="#0d9488" stroke-width="0.5" opacity="0.2"/>
</svg>